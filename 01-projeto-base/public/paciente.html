<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini-Prontuário · Atendimentos</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous" />

  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>

<body>
  <header class="app-header">
    <div class="container">
      <p class="app-header__eyebrow">IFPI · Programação para Internet II</p>
      <h1 class="app-header__title">Mini-Prontuário</h1>
    </div>
  </header>

  <main class="container app-main">
    <p class="mb-4"><a href="./index.html">&larr; Voltar para a lista de pacientes</a></p>

    <!-- Carregando / erro de página inteira. render.js decide o que aparece aqui. -->
    <div id="page-state"></div>

    <!-- Conteúdo real: só aparece depois que o paciente carrega com sucesso. -->
    <div id="page-content" class="d-none">
      <section id="patient-summary" class="patient-summary mb-5" aria-label="Dados do paciente"></section>

      <section class="mb-5" aria-label="Atendimentos">
        <h2 class="h5 mb-3">Atendimentos</h2>
        <ul id="encounter-list" class="encounter-list"></ul>
      </section>

      <section aria-label="Registrar novo atendimento">
        <h2 class="h5 mb-3">Novo atendimento</h2>

        <div id="form-error" class="alert alert-danger d-none" role="alert"></div>

        <form id="encounter-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="started-at-input">Data e hora</label>
            <input
              id="started-at-input"
              name="startedAt"
              class="form-control"
              type="datetime-local"
              required />
          </div>

          <div class="mb-3">
            <label class="form-label" for="chief-complaint-input">Queixa principal</label>
            <input
              id="chief-complaint-input"
              name="chiefComplaint"
              class="form-control"
              type="text"
              placeholder="Motivo declarado da visita…"
              required />
          </div>

          <div class="mb-3">
            <label class="form-label" for="notes-input">Conduta (opcional)</label>
            <textarea
              id="notes-input"
              name="notes"
              class="form-control"
              rows="3"
              placeholder="O que ficou registrado depois do atendimento…"></textarea>
          </div>

          <button id="submit-button" class="btn btn-primary" type="submit">Registrar atendimento</button>
        </form>
      </section>
    </div>
  </main>

  <script type="module" src="./js/patient-detail.js"></script>
</body>
</html>
