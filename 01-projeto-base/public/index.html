<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini-Prontuário</title>

  <!-- Bootstrap 5.3 via CDN: grid, utilitários e componentes base -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous" />

  <!-- Nossa camada: a ordem importa. Tokens -> base -> componentes -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>

<body>
  <header class="app-header">
    <div class="container">
      <p class="app-header__eyebrow">IFPI · Programação para Internet II</p>
      <h1 class="app-header__title">Mini-Prontuário</h1>
    </div>
  </header>

  <main class="container app-main">

    <div id="form-error-container"></div>

    <!-- ------------------------------------------------------
         Cadastro de paciente, com upload opcional de foto.
    ------------------------------------------------------- -->
    <section aria-label="Novo paciente" class="mb-4">
      <h2 class="h5 mb-3">Novo paciente</h2>
      <form id="patient-form" class="row g-2">
        <div class="col-12 col-md-4">
          <input class="form-control" name="name" placeholder="Nome completo" required />
        </div>
        <div class="col-6 col-md-3">
          <input class="form-control" name="birthDate" type="date" required />
        </div>
        <div class="col-6 col-md-3">
          <input class="form-control" name="nationalId" placeholder="CNS" required />
        </div>
        <div class="col-12 col-md-2">
          <input id="photo" class="form-control" name="photo" type="file" accept="image/jpeg,image/png" />
        </div>
        <div class="col-12 col-md-2">
          <button class="btn btn-success w-100" type="submit">Cadastrar</button>
        </div>
        <div id="photo-preview-container" class="col-12"></div>
      </form>
    </section>

    <!-- ------------------------------------------------------
         Barra de filtros.
         Nenhum evento é registrado aqui: isso é papel do app.js.
         O HTML descreve a ESTRUTURA, não o comportamento.
    ------------------------------------------------------- -->
    <section class="toolbar" aria-label="Filtros da lista de pacientes">
      <div class="toolbar__search">
        <label class="form-label" for="search-input">Buscar paciente</label>
        <input
          id="search-input"
          class="form-control form-control-lg"
          type="search"
          placeholder="Digite parte do nome…"
          autocomplete="off" />
      </div>

      <div class="toolbar__filter form-check form-switch">
        <input class="form-check-input" type="checkbox" id="only-active-input" />
        <label class="form-check-label" for="only-active-input">
          Mostrar apenas pacientes ativos
        </label>
      </div>
    </section>

    <p id="result-counter" class="result-counter" aria-live="polite"></p>

    <!-- A lista é desenhada por render.js. Ela nasce vazia de propósito. -->
    <ul id="patient-list" class="patient-list"></ul>

  </main>

  <!-- type="module" habilita import/export no navegador -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
